name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 7 * * 1"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: Build
        run: npm run build

      # Audit informatif : reporte les vulnérabilités (surtout transitives/dev)
      # sans bloquer la PR. Remédiation suivie dans ARROW-244.
      - name: Production audit
        run: npm run audit:prod
        continue-on-error: true
